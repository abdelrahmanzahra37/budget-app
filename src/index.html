 '<small class="mu">الرابط الأساسي</small><input data-k="ai.url" dir="ltr" value="'+esc(a.url)+'">'+
 '<small class="mu">اسم الموديل</small><input data-k="ai.model" dir="ltr" value="'+esc(a.model)+'">'+

function jget(u){return TA?inv('http_get',{url:u}).then(JSON.parse):fetch(u).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})}
function fxFetch(){
 return Promise.resolve().then(function(){return jget('https://open.er-api.com/v6/latest/USD')}).then(function(d){if(d.result!=='success'||!d.rates)throw new Error('bad');return{t:Date.now(),src:'ExchangeRate-API',rates:d.rates}})
 .catch(function(){return jget('https://api.frankfurter.dev/v1/latest?from=USD').then(function(d){var r=d.rates;r.USD=1;return{t:Date.now(),src:'البنك المركزي الأوروبي (Frankfurter)',rates:r}})})
 .then(function(x){FX=x;try{localStorage.setItem('fxc',JSON.stringify(x))}catch(e){}})}
function fxKick(force){if(fxBusy)return;if(!force&&FX&&Date.now()-FX.t<216e5)return;fxBusy=1;fxErr='';
 fxFetch().then(function(){},function(){fxErr=FX?'تعذر التحديث، معروض آخر أسعار محفوظة.':'تعذر تحميل الأسعار. اتأكد من الإنترنت.'}).then(function(){fxBusy=0;if(tab()==='fx')render()})}
function fxN(v){return v.toLocaleString('en-US',{maximumFractionDigits:v<1?6:2})}
function fxRes(){var f=C.fx,R=FX&&FX.rates,n=parseFloat(f.amt);if(!R||!R[f.from]||!R[f.to]||!(n>=0))return'—';return fxN(n*R[f.to]/R[f.from])+' '+f.to}
function fx(){fxKick(false);var f=C.fx,R=FX&&FX.rates;
 function sel(k,cur){var cs_=Object.keys(R).sort(),pop=Object.keys(FXN).filter(function(c){return R[c]}),rest=cs_.filter(function(c){return !FXN[c]});
  return'<select data-k="'+k+'">'+pop.concat(rest).map(function(c){return opt(c,c+(FXN[c]?' · '+FXN[c]:''),cur)}).join('')+'</select>'}
 if(!R)return'<div style="height:18px"></div><div class="card"><b>تحويل العملات</b><p class="mu">'+(fxBusy?'⏳ جاري تحميل الأسعار…':esc(fxErr||''))+'</p><button class="btn" data-a="fxr">إعادة المحاولة</button></div>';
 var rate=R[f.to]/R[f.from];
 return'<div style="height:18px"></div><div class="card"><b>تحويل العملات</b><small class="mu" style="display:block;margin-top:8px">المبلغ</small><input id="fxA" type="number" inputmode="decimal" value="'+esc(f.amt)+'"><small class="mu">من</small>'+sel('fx.from',f.from)+'<button class="btn g" data-a="fxswap">⇅ عكس</button><small class="mu">إلى</small>'+sel('fx.to',f.to)+
 '<div style="text-align:center;padding:10px 0"><div id="fxR" style="font-size:30px;font-weight:800" class="in">'+fxRes()+'</div><div class="mu" style="margin-top:4px">1 '+f.from+' = '+fxN(rate)+' '+f.to+'</div></div></div>'+
 '<div class="card"><small class="mu">المصدر: '+esc(FX.src)+' · آخر تحديث: '+new Date(FX.t).toLocaleString()+'</small>'+(fxErr?'<p class="ex">'+esc(fxErr)+'</p>':'')+'<p class="mu">الأسعار متوسط السوق الرسمي وبتتحدث يومياً، وممكن تختلف عن سعر البنك أو السوق الموازي.</p><button class="btn g" data-a="fxr">'+ic('cloud')+'تحديث الآن</button><small class="mu">Rates By Exchange Rate API · exchangerate-api.com</small></div>'}
function tmo(p,ms){return new Promise(function(res,rej){var t=setTimeout(function(){rej(new Error('انتهت المهلة، اتأكد من الإنترنت'))},ms);p.then(function(v){clearTimeout(t);res(v)},function(e){clearTimeout(t);rej(e)})})}
function ask(q,sys0){
 var a=curAI();if(!a||(a.type==='anthropic'&&!a.key))return Promise.resolve('اكتب مفتاح API في الإعدادات الأول.');
 var ctx=JSON.stringify({رصيد_البداية:S.start,المعاملات:S.tx.map(function(x){return[x.type,x.cat,MON[x.m],x.amt]})}),
 sys=sys0||'أنت مساعد مالي شخصي. جاوب بالعربي المصري وباختصار اعتماداً على بيانات الميزانية دي (نوع، بند، شهر، مبلغ): '+ctx,
 an=a.type==='anthropic',
 url=a.url.replace(/\/$/,'')+(an?'/v1/messages':'/chat/completions'),
 hd=an?{'content-type':'application/json','x-api-key':a.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'}:{'content-type':'application/json'},
 bd=an?{model:a.model,max_tokens:1000,system:sys,messages:[{role:'user',content:q}]}:{model:a.model,messages:[{role:'system',content:sys},{role:'user',content:q}]};
 if(!an&&a.key)hd.authorization='Bearer '+a.key;
 return tmo(TA?inv('http_post',{url:url,headers:hd,body:JSON.stringify(bd)}).then(JSON.parse):fetch(url,{method:'POST',headers:hd,body:JSON.stringify(bd)}).then(function(r){return r.json()}),45000).then(function(d){if(d.error)throw new Error(d.error.message||JSON.stringify(d.error));return an?d.content.map(function(b){return b.text||''}).join(''):d.choices[0].message.content})}
/* ---------- events ---------- */
function act(a){
 Promise.resolve().then(function(){
  var J={types:[{accept:{'application/json':['.json']}}]};
  if(a==='new'||a==='open'){
   var pk=a==='new'?showSaveFilePicker({suggestedName:'budget-data.json',types:J.types}):showOpenFilePicker(J).then(function(x){return x[0]});
   return Promise.resolve(pk).then(function(h){return idb('put',h).then(function(){C.mode='fs';cs();return a==='open'?h.getFile().then(function(f){return f.text()}).then(merge):0}).then(function(){sv()})})}
  if(a==='pick')return electronAPI.pick().then(function(p){if(!p)return;C.mode='el';C.path=p;cs();return rd().then(function(t){if(t)merge(t);sv()})});
  if(a==='cap')return Promise.resolve(Capacitor.Plugins.Filesystem.requestPermissions()).then(function(){C.mode='cap';cs();return rd()}).then(function(t){if(t)merge(t);sv()});
  if(a==='fsperm')return idb('get').then(function(h){return h.requestPermission({mode:'readwrite'})}).then(function(){return rd()}).then(function(t){if(t)merge(t);sv()});
  if(a==='keysx'){if(confirm('تمسح كل مفاتيح API وبيانات Google من الجهاز؟')){C.ais.forEach(function(x){x.key=''});C.g.sec='';C.g.rt='';GT=null;cs()}return}
  if(a==='accx'){C.acc='';cs();return}
  if(a==='elp'){C.mode='el';cs();return rd().then(function(t){if(t)merge(t);sv()})}
  if(a==='gin')return gin();
  if(a==='gsync')return gs(true);
  if(a==='gout'){C.g.rt='';GT=null;cs();return}
  if(a==='aidel'){C.ais=C.ais.filter(function(x){return x.id!==C.act});C.act=C.ais[0].id;cs();return}
  if(a==='fxswap'){var t_=C.fx.from;C.fx.from=C.fx.to;C.fx.to=t_;cs();return}
  if(a==='fxr'){fxKick(true);return}
  if(a==='off'){C.mode='';cs()}
  else if(a==='exp'){var l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));l.download='budget-data.json';l.click()}
  else if(a==='imp')document.getElementById('imp').click();
  else if(a==='reset'){if(confirm('إعادة كل البيانات للأصل؟')){S=seed();sv()}}
 }).catch(function(e){if(!e||e.name!=='AbortError')setSt('⚠ '+(e&&e.message||e))}).then(render)}

 var t=e.target.closest('[data-tab],[data-mm],[data-del],[data-ty],[data-a],#fab,#save,#cancel,#aiGo');if(!t)return;

 else if(t.dataset.ty){ty=t.dataset.ty;openM()}
 else if(t.dataset.a){if(!act2(t.dataset.a,t.dataset.id))act(t.dataset.a)}

 else if(t.id==='cancel')closeM();
 else if(t.id==='save'){var c=document.getElementById('fCat').value.trim(),v=parseFloat(document.getElementById('fAmt').value);

  var mm=+document.getElementById('fMon').value;S.tx.push({id:uid(),type:ty,cat:c,m:mm,amt:v});sv();closeM();render();setSt('✓ اتسجلت في '+MON[mm])}
 else if(t.id==='aiGo'){var q=document.getElementById('aiQ').value.trim(),o=document.getElementById('aiOut');if(!q)return;o.textContent='⏳ جاري التفكير…';
  ask(q).then(function(t){o.textContent=t},function(x){o.textContent='⚠ '+x.message})}
});
